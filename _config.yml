title: Vikram Kumar | Managing Director | BlackRock
description: Managing Director – Aladdin Wealth Tech | BlackRock | 20+ years in Technology Leadership | FMS MBA
author: Vikram Kumar
location: NCR, India
url: https://www.vikramkumar.org
baseurl: ""

# Custom Apple-inspired theme (no external theme)
# Using custom layouts and CSS

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Keep repo housekeeping files out of the published site
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# SASS configuration for custom styling
sass:
  style: compressed

# Default share image (Open Graph / Twitter). jekyll-seo-tag reads page.image,
# so it is applied to every page via defaults; site.image feeds the Person JSON-LD.
image: /assets/images/og-image.png
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-image.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /blog/:title/

# Social links
social:
  name: Vikram Kumar
  links:
    - https://www.linkedin.com/in/vikramkumar/
    - https://github.com/coolviki

# SEO settings
lang: en
timezone: Asia/Kolkata

# Google Analytics
google_analytics: G-5E0NPRC1M7